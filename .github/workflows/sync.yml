name: sync site data from the cabinet
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: pull data into both site branches
        env:
          API: https://script.google.com/macros/s/AKfycbyx2xTh2XgMOT9SLX1YnBMxplKZfJYED21TPcUFick88_68qLgkqeAtkst3ia2_K6de/exec
        run: |
          git config user.name "kbc-sync"
          git config user.email "sync@kazakhstanbycar.kz"
          for b in kz com; do
            git checkout -q $b
            node sync.js
            if ! git diff --quiet; then git commit -qam "sync: cabinet data"; git push -q origin $b; fi
          done
