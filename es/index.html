 o tres días de viaje. El mismo vehículo, el mismo guía, noches por el camino. Precio bajo consulta: depende de los días y de las noches.","items":[{"name":"Issyk-Kul, Kirguistán","days":"3–4 días","km":"450 km · 7 h hasta la orilla norte","desc":"El segundo lago de montaña más grande del mundo. Por el paso de Kegen o por la garganta de Boom, con baño, la garganta de Grigorievka y regreso por otro camino. Pasaporte para la frontera."},{"name":"Lago Alakol","days":"3 días","km":"600 km · 8 h","desc":"Un lago salado y cálido de guijarros negros en el este de la región. Temporada de baño de junio a septiembre; Taldykorgan y la Puerta de Dzungaria de camino."},{"name":"Lago Baljash","days":"2 días","km":"420 km · 5 h","desc":"Un lago mitad dulce, mitad salado, de quinientos kilómetros de largo. Pesca, orillas de arena, noche en Priozersk o acampando."},{"name":"Embalse de Kapchagay","days":"Medio día","km":"70 km · 1 h","desc":"La gran masa de agua más cercana. Playas, lanchas, atardecer en la presa y Tamgaly-Tas de camino. Fácil de añadir a cualquier día."}],"cta":"Preguntar por una ruta lejana"},"city":{"kicker":"En la ciudad y en el aeropuerto","h2":"Le recibimos, le despedimos, le llevamos.","items":[{"name":"Recepción en el aeropuerto","price":"desde $30","desc":"Con un cartel a la salida, ayuda con el equipaje y agua en el vehículo. A cualquier hora; seguimos el vuelo. Despedida al mismo precio."},{"name":"Vehículo con conductor por la ciudad","price":"desde $15 por hora, mínimo 3 horas","desc":"Viajes de negocios, compras, mercados, Medeu y Shymbulak, restaurantes por la noche. El conductor conoce la ciudad y espera el tiempo que haga falta."},{"name":"Tour por la ciudad de Almaty","price":"desde $110 por vehículo","desc":"De 4 a 6 horas: el parque Panfilov y la catedral de la Ascensión, el Bazar Verde, la plaza de la República, Medeu y el teleférico a Kok-Tobe. Entradas incluidas."}]},"fleet":{"kicker":"La flota","h2":"Un vehículo para su grupo.","text":"Seis ve una yurta en Assy. Díganos con antelación qué come y el menú se prepara a su medida: vegetariano, sin cerdo, para niños.","items":[["Beshbarmak","carne sobre pasta estirada a mano, el plato principal de toda celebración, en la casa de huéspedes de Saty"],["Kazy y karta","embutido de carne de caballo curado en casa, en la mesa de los pastores de la meseta"],["Manty","grandes dumplings al vapor de cordero y cebolla, con crema agria, para almorzar en una yurta"],["Baursaks y kaymak","buñuelos calientes con crema, junto al té con leche antes de salir"],["Kumis y shubat","leche de yegua y de camella en las yurtas de Assy, para quien se anime"],["Shashlik a orillas del Ili","en la ribera, con vista al río, acompañado de té kazajo"]],"note":"El almuerzo cuesta 5–10 $ por persona y se paga en el lugar. El pícnic no está incluido en el precio del tour, pero el agua y los snacks siempre lo están.","photos":["Plov junto al río","Manty para el almuerzo","Shashlik a las brasas"]},"banya":{"kicker":"Sauna a la orilla del río","h2":"Una banya portátil junto al río.","text":"Montamos la sauna portátil Mobiba a la orilla de un río o de un lago, o directamente en la meseta; la calentamos con leña, tomamos el vapor y nos lanzamos al agua. Cómoda para hasta 15 personas. Después de un día de caminos polvorientos, es lo mejor que puede hacer. Llevamos ramas de abedul, toallas y té, en verano y en invierno.","price":"desde $120 por velada para el grupo","cta":"Añadir la banya al tour","insta":"Nuestra banya en Instagram: @mobibantour"},"calc":{"kicker":"Precio y fechas","h2":"Calcúlelo usted mismo.","text":"Elija el tour, la fecha y cuántos son. El total es por vehículo. Envíelo tal cual por WhatsApp y confirmamos la fecha en menos de una hora.","tour":"Tour","service":"Servicio","tiers":{"taxi":"Solo transporte","ru":"Conductor-guía en ruso","en":"Conductor-guía en inglés"},"perCar":"por vehículo","serviceHint":"Solo transporte: el trayecto, las entradas a los parques y el agua. Conducto a del propietario, actualizado el","builtIn":"Se muestra la lista de precios integrada.","est":{"kicker":"Su propia ruta","h3":"Estimación aproximada de una ruta a medida","text":"Un día de vehículo con conductor-guía cubre 250 km. Los días más largos añaden $0.25 por kilómetro; los caminos de tierra y de montaña, $40 por día. Envíe el resultado con la lista de lugares y lo convertimos en una ruta real.","days":"Días","km":"Kilómetros en total","gravel":"Caminos de tierra o de montaña en la ruta","gravelP":"+$40 por día","out":"Estimación por vehículo, conductor-guía incluido","cta":"Hablar de esta ruta por WhatsApp","formula":{"day":"día","days":"días","extra":"km extra ×","gravel":"caminos de tierra","note":"Las noches y el almuerzo se añaden por persona."}}},"distances":{"kicker":"A qué distancia está","h2":"Todo empieza en la puerta de su hotel.","text":"Distancia por carretera y tiempo de conducción desde el centro de Almaty, solo ida. Las carreteras de montaña son más lentas de lo que sugieren los kilómetros.","items":[["0 km","Almaty","su hotel","almaty"],["28 km","Gran Lago de Almaty","aprox. 1 h","bao"],["70 km","Kapchagay","aprox. 1 h","kapchagay"],["120 km","Tamgaly-Tas","aprox. 2 h","tamgaly"],["130 km","Meseta de Assy","aprox. 3 h","assy"],["215 km","Cañón de Charyn","aprox. 3 h","charyn"],["260 km","Altyn-Emel","aprox. 4 h","altyn"],["300 km","Lagos Kolsai","aprox. 4,5 h","kolsai2"],["450 km","Issyk-Kul","aprox. 7 h","issykkul"]],"detail":{"inTour":"Este lugar está incluido en el tour","priceHint":"Precio orientativo","perCar":"por vehículo","more":"Más sobre el tour","calc":"Precio para mis fechas","close":"Cerrar","farNote":"Ruta de varios días; precio y noches bajo consulta","tap":"Toque un punto para ver qué hay allí"}},"guide":{"kicker":"Su conductor-guía","h2":"Una sola persona, de puerta a puerta.","text":"La misma persona que le responde por WhatsApp le recoge en el hotel, conduce, cuenta las historias y hace las fotos. Sin agencias intermediarias ni cambios de vehículo por el camino.","ticks":["Nacido en Almaty, recorre estos caminos cada semana","Inglés, ruso y kazajo","Guía con licencia, formación en primeros auxilios","Conexión satelital bajo petición"]},"reviews":{"kicker":"Opiniones","h2":"Lo que dicen los viajeros","text":"Opiniones de ejemplo para la maqueta. En el sitio real se cargan desde Google y Tripadvisor con enlace al original.","items":[["Reservamos Charyn la noche anterior y a las 7 de la mañana ya nos estaban recogiendo. Lo mejor fue bajar al cañón, y almorzamos en un lugar que jamás habríamos encontrado solos.","Lena, Alemania","Cañón de Charyn, 1 día"],["Dos días en Kolsai y Kaindy con un niño pequeño. El asiento infantil estaba puesto, paradas a la primera petición y la casa de huéspedes de Saty, sencilla y acogedora. Vale cada tenge.","Rahul y Priya, India","Kolsai y Kaindy, 2 días"],["Tenía un día libre entre reuniones. Por la mañana el Gran Lago de Almaty y a las dos de vuelta. Precio claro por WhatsApp, sin sorpresas.","Tom, Reino Unido","Gran Lago de Almaty, medio día"]]},"how":{"kicker":"Cómo funciona","h2":"Tres mensajes y su viaje queda reservado.","text":"Sin formularios ni anticipo para los tours de un día. La ruta se puede cambiar por el camino.","steps":[["Escríbanos por WhatsApp","Sus fechas, cuántos son y qué le gustaría ver. O envíe el resultado de la calculadora tal cual."],["Reciba la ruta y el precio","Un borrador del programa con horarios y un precio fijo por vehículo, el mismo día. Cambie lo que quiera."],["Le recogemos","En su hotel, a la hora elegida. Se paga el día del viaje en efectivo, con tarjeta o por transferencia."]]},"faq":{"kicker":"Preguntas","h2":"Antes de escribirnos","items":[["¿El precio es por persona o por vehículo?","Por vehículo, hasta cuatro personas. Una pareja y un grupo de cuatro pagan lo mismo por el vehículo; el almuerzo y las noches se calculan por persona."],["¿Hacen tours en grupo?","No. Cada salida es privada: sus fechas, su ritmo, sus paradas. A partir de cinco personas ponemos el minibús."],["¿Cómo se paga?","El día del viaje, en efectivo (tenge, dólares o euros), con tarjeta o por transferencia. Los tours de dos días requieren un anticipo del 20% para reservar la casa de huéspedes."],["¿Qué debo llevar?","Ropa en capas (en los lagos hace 10 grados menos que en la ciudad), protección solar, calzado cómodo y el pasaporte para los puestos de control de los parques nacionales."],["¿Se puede cambiar el plan por el camino?","Sí. Quedarse más tiempo en un mirador, saltarse una parada, añadir otra. Lo único fijo es la hora de cierre de los parques."],["¿Recogen en el aeropuerto y hacen recorridos por la ciudad?","Sí. Traslados a cualquier hora, vehículo con conductor por horas y tour por la ciudad de Almaty. Medio día en el Gran Lago de Almaty cabe en una escala larga."]]},"cta":{"h2":"Díganos sus fechas. Hoy mismo le enviamos la ruta y el precio.","text":"Respondemos de 8:00 a 22:00, hora de Almaty, normalmente en menos de una hora.","btn":"Escribir por WhatsApp","phoneLbl":"WhatsApp y llamadas","formTitle":"Escribir por correo","formName":"Nombre","formContact":"WhatsApp o e-mail","formMsg":"Fechas, cuántos son, qué le gustaría ver","formBtn":"Enviar","formHint":"El mensaje llega directamente a Mikhail. Respuesta en el mismo día.","formNeed":"Complete su nombre, un contacto y el mensaje.","formOk":"Enviado. Mikhail responderá al contacto indicado.","formFail":"No se pudo enviar. Escríbanos por WhatsApp; el botón está arriba."},"footer":{"about":"Almaty, Kazajistán. Tours privados en 4x4 de uno y varios días, traslados y vehículo con conductor. Todo el año; las mesetas de montaña y los lagos, de primavera a otoño.","cols":[["Destinos",["Gran Lago de Almaty","Cañón de Charyn","Kolsai y Kaindy","Meseta de Assy","Altyn-Emel","Tamgaly-Tas","Kapchagay","Issyk-Kul","Alakol","Baljash"]],["Contacto",["WhatsApp +7 707 000 90 09","hello@mchechin81.com","Instagram @mchechin81","Almaty, recogida en cualquier di  천문대","आसी पठार, वेधशाला"],["Kolsai, el sendero junto al primer lago","콜사이 첫 번째 호수 산책로","कोलसाई, पहली झील के किनारे का रास्ता"],["Charyn, bajando al Valle de los Castillos","차른, 성의 계곡으로 내려가는 길","चारिन, कैसल्स की घाटी में उतरना"],["Gran Lago de Almaty, temprano por la mañana","빅 알마티 호수, 이른 아침","बिग अल्माटी झील, सुबह जल्दी"],["Meseta de Assy, té junto a una yurta al atardecer","아씨 고원, 해질녘 유르트 옆에서 차 한잔","आसी पठार, सूर्यास्त में यर्ट के पास चाय"],["Selfi en la entrada del cañón de Charyn: invitados de Corea y el director Kim Kwang-sik","차른 협곡 입구에서 찍은 셀카: 한국에서 온 손님들과 김광식 감독","चारिन कैन्यन के प्रवेश पर सेल्फ़ी: कोरिया से आए मेहमान और निर्देशक किम क्वांग-सिक"],["El director Kim Kwang-sik y su colega junto al cartel del cañón de Charyn","차른 협곡 표지판 앞의 김광식 감독 일행","चारिन कैन्यन साइनबोर्ड पर निर्देशक किम क्वांग-सिक और साथी"],["Almuerzo a orillas del río Charyn, junto al coche","차른 강가, 차 옆에서의 점심","चारिन नदी के किनारे, गाड़ी के पास लंच"],["A caballo hacia el segundo lago Kolsai","말을 타고 콜사이 두 번째 호수로","घोड़े पर कोलसाई की दूसरी झील की ओर"]],"hi_text":"प्रसिद्ध कोरियाई फ़िल्म निर्देशक किम क्वांग-सिक (김광식) और उनके साथी ने Kazakhstan by Car के साथ चारिन कैन्यन, इस्सिक झील और आसी पठार की यात्रा की। अल्माटी से निजी कार टूर, भारतीय मेहमानों के लिए शाकाहारी भोजन।","me":"Ese soy yo, Mikhail: organizador y conductor-guía"},"seo":{"title":"Tours privados en 4x4 desde Almaty | Kazakhstan by Car","description":"Tours privados en 4x4 desde Almaty con conductor-guía: cañón de Charyn, lagos Kolsai y Kaindy, meseta de Assy. Precio por vehículo, reserva por WhatsApp."},"join":{"kicker":"Para socios","h2":"Conviértase en nuestro guía o conductor.","text":"Estamos creando una red de conductores-guía privados en todo Kazajistán: Almaty, Astaná, Shymkent, Turkestán, Oskemen. Su propio coche, conocimiento de los lugares y de idiomas, amor por la carretera; del resto nos ocupamos nosotros: reservas desde la web, calendario y clientes de ocho países.","perks":["Clientes y reservas desde una web en ocho idi   (function(){ var box=$('wx'); if(!box||!window.fetch)return; var KEY='kbc-wx2'; try{ var c=JSON.parse(localStorage.getItem(KEY)||'null'); if(c&&Date.now()-c.at<1800000){ wxRender(c); return; } }catch(e){}
    var u='https://api.open-meteo.com/v1/forecast?latitude='+WX_PLACES.map(function(p){return p[1]}).join(',')+'&longitude='+WX_PLACES.map(function(p){return p[2]}).join(',')+'&current=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min&forecast_days=7&timezone=Asia%2FAlmaty';
    fetch(u).then(function(r){return r.ok?r.json():null}).then(function(j){ if(!j)return; var arr=Array.isArray(j)?j:[j]; var d={at:Date.now(),list:arr.map(function(o,i){var dl=o.daily||{}; return {id:WX_PLACES[i][0],t:o.current.temperature_2m,code:o.current.weather_code,days:(dl.time||[]).map(function(dt,k){return {d:dt,hi:dl.temperature_2m_max[k],lo:dl.temperature_2m_min[k],c:dl.weather_code[k]}})}})}; try{localStorage.setItem(KEY,JSON.stringify(d))}catch(e){} wxRender(d); }).catch(function(){}); })();
  $('langSel').addEventListener('change',function(e){var l=e.target.value; try{localStorage.setItem('kbc-lang',l)}catch(x){} if(MULTIPAGE){ location.href=(LANG_URLS[l]||((l==='ru'?'/':'/'+l+'/')))+location.hash; return; } if(!CONTENT[l]){ e.target.value=LANG; return; } LANG=l; T=CONTENT[LANG]; renderAll();});

  function renderAll(){ renderStatic(); buildTours(); buildFromTours(); sel.value=state.tour; onTour(); estUpdate(); applyLive(); if(window.__wx)wxRender(window.__wx); fleetLive(); applySeasonExperience(); setTimeout(function(){ tilt(); reveal(); },50); }
  var live={busy:null,tours:null};
  function applyLive(){
    if(live.busy){ busy={}; live.busy.busy.forEach(function(iso){var p=iso.split('-'); busy[(+p[0])+'-'+(+p[1])+'-'+(+p[2])]=1;}); busyCars={}; Object.keys(live.busy.cars||{}).forEach(function(id){busyCars[id]={}; live.busy.cars[id].forEach(function(iso){var p=iso.split('-'); busyCars[id][(+p[0])+'-'+(+p[1])+'-'+(+p[2])]=1;});}); var u=new Date(live.busy.updated); $('calUpdated').textContent=t('calc.updated')+' '+u.toLocaleDateString(LOCALE[LANG],{day:'numeric',month:'short'})+' '+u.toLocaleTimeString(LOCALE[LANG],{hour:'2-digit',minute:'2-digit'}); renderCal(); update(); }
    if(live.tours){ var u2=new Date(live.tours.updated); $('priceUpdated').textContent=t('pricelist.sheetUpdated')+' '+u2.toLocaleDateString(LOCALE[LANG],{day:'numeric',month:'short'})+' '+u2.toLocaleTimeString(LOCALE[LANG],{hour:'2-digit',minute:'2-digit'})+'.'; }
  }
  renderAll();
  fetch('busy.json',{cache:'no-store'}).then(function(r){return r.ok?r.json():null}).then(function(j){ if(!j||!j.busy)throw new Error('x'); live.busy=j; applyLive(); }).catch(function(){ $('calUpdated').textContent=t('calc.notLoaded'); });
  fetch('tours.json',{cache:'no-store'}).then(function(r){return r.ok?r.json():null}).then(function(j){ if(!j||!j.tours||!j.tours.length)throw new Error('x'); PRICES=j.tours; live.tours=j; buildTours(); buildFromTours(); onTour(); applyLive(); }).catch(function(){ $('priceUpdated').textContent=t('pricelist.builtIn'); });
})();
