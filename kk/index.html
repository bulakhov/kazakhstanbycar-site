.bar .btn{flex:1;justify-content:center;padding-block:12px;white-space:nowrap}

@media(max-width:360px){.brand{font-size:15px}.brand svg{width:30px;height:30px}.lang button{padding-inline:5px}.burger{padding-inline:10px}.bar{gap:6px}.bar .btn{padding-inline:10px;font-size:14px}}
.hub{display:inline-flex;align-items:center;gap:12px;margin-top:18px;padding:10px 14px 10px 10px;border:1px solid rgba(255,255,255,.22);border-radius:14px;color:#fff;text-decoration:none;background:rgba(255,255,255,.05)}.hub svg{width:40px;height:40px;color:var(--marking);flex:none}.hub b{display:block;font-family:var(--display);font-size:18px;letter-spacing:.04em;text-transform:uppercase;line-height:1}.hub em{display:block;font-style:normal;font-size:12.5px;color:rgba(255,255,255,.7);margin-top:3px}.hub:hover{border-color:var(--marking)}
/* cosmic layer: animated semi-transparent neurons, 3D tilt, reveal */
.neuro{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.hero .neuro{z-index:-1;opacity:.55;mix-blend-mode:screen}
.cosmic{position:relative;overflow:hidden;background:radial-gradient(1200px 600px at 15% 10%,rgba(216,87,42,.22),transparent 60%),radial-gradient(900px 500px at 85% 90%,rgba(242,193,78,.16),transparent 60%),var(--spruce-2)}

.roles{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.roles a{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:999px;border:1.5px solid rgba(255,255,255,.35);color:#fff;text-decoration:none;font-size:14px;font-weight:600;background:rgba(8,26,23,.35);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:transform .2s,border-color .2s}

.roles a::after{content:"→";font-family:var(--display);font-size:18px;line-height:1;color:var(--marking)}
[data-tilt]{transform-style:preserve-3d;transition:transform .25s ease,box-shadow .25s ease;will-change:transform}
[data-tilt].tilting{transition:transform .05s linear}
[data-tilt]:hover{box-shadow:0 24px 50px -20px rgba(0,0,0,.45)}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .7s cubic-bezier(.2,.7,.2,1),transform .7s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}

      rows+='<tr><td class="n">'+esc(tr.name)+'<small>'+tr.km+' '+esc(t('pricelist.kmByCar'))+'</small></td><td>'+esc(tr.len)+'</td>'+
        '<td class="p">'+fmt(tr.price.taxi)+'<small>≈ '+fmtT(tr.price.taxi*RATE)+'</small></td><td class="p">'+fmt(tr.price.ru)+'<small>≈ '+fmtT(tr.price.ru*RATE)+'</small></td><td class="p en">'+fmt(tr.price.en)+'<small>≈ '+fmtT(tr.price.en*RATE)+'</small></td>'+
        '<td><span class="months" title="'+esc(monthsLabel(tr.season)+(tr.peak?'; +'+tr.peak.pct+'% '+monthsLabel(tr.peak.months):'')+(tr.low?'; '+tr.low.pct+'% '+monthsLabel(tr.low.months):''))+'">'+T.pricelist.months.map(function(m){return '<b>'+esc(m)+'</b>'}).join('')+ALL.map(function(m){var c=tr.season.indexOf(m)>=0?'on':''; if(tr.peak&&tr.peak.months.indexOf(m)>=0)c='on peak'; else if(tr.low&&tr.low.months.indexOf(m)>=0)c='on low'; return '<i class="'+c+'"></i>'}).join('')+'</span></td></tr>';
    });
    $('priceRows').innerHTML=rows;
    document.querySelectorAll('#tourGrid .tour[data-id]').forEach(function(card){ var tr=TOURS[card.getAttribute('data-id')]; var dd=card.querySelector('.meta .price dd.from'); if(tr&&dd) dd.textContent=t('tours.from')+' '+fmt(tr.price.taxi); });
  }
  var sel=$('tourSel');
  sel.addEventListener('change',onTour);
  function onTour(){
    state.tour=sel.value; var tr=TOURS[state.tour];
    $('tourHint').textContent=(tr.text.desc||'')+seasonNote(tr);
    $('pTaxi').textContent=fmt(tr.price.taxi)+' '+t('calc.perCar'); $('pRu').textContent=fmt(tr.price.ru)+' '+t('calc.perCar'); $('pEn').textContent=fmt(tr.price.en)+' '+t('calc.perCar');
    $('optStayRow').hidden=tr.days<2;
    if(state.date&&tr.season.indexOf(state.date.getMonth()+1)<0){state.date=null;}
    renderCal(); update();
  }
  var seg=$('tierSeg');
  seg.addEventListener('change',function(e){state.tier=e.target.value;seg.querySelectorAll('label').forEach(function(l){l.classList.toggle('on',l.querySelector('input').checked)});update();});
  $('nMinus').addEventListener('click',function(){if(state.n>1){state.n--;update();}});
  $('nPlus').addEventListener('click',function(){if(state.n<car().seats){state.n++;update();}});
  ['optLunch','optStay','optPickup','optSeat','optBanya','optStarlink'].forEach(function(id){$(id).addEventListener('change',update)});

  function update(){
    var tr=TOURS[state.tour],L=T.calc.lines,lines=[],total=0; if(!tr)return;
    $('nOut').value=state.n;
    var tierName=T.calc.tiers[state.tier];
    var base=tr.price[state.tier];
    var lc=function(x){return LANG==='de'?x:x.toLowerCase()};
    lines.push([L.car+' '+lc(tierName)+', '+tr.len,fmt(base)]);
    var cf=car(); lines.push([T.calc.car,cf.name]);
    if(cf.factor&&cf.factor!==1){var carExtra=Math.round(base*(cf.factor-1)); base+=carExtra; lines.push([L.carLine+' ×'+cf.factor,(carExtra>0?'+':'')+fmt(carExtra)]);}
    total+=base; $('carHint').textContent=t('calc.carHint').replace('{n}',cf.seats);
    var adj=seasonAdj(tr,state.date);
    if(adj){var delta=Math.round(base*adj.pct/100); total+=delta; lines.push([adj.name+' '+(adj.pct>0?'+':'')+adj.pct+'%',(delta>0?'+':'−')+fmt(Math.abs(delta))]);}
    if($('optLunch').checked){var l=LUNCH*state.n*tr.days; total+=l; lines.push([L.lunch+', '+state.n+' × '+tr.days+' '+(tr.days>1?L.days:L.day),fmt(l)]);}
    if(tr.days>1&&$('optStay').checked){var s=STAY*state.n*(tr.days-1); total+=s; lines.push([L.stay+', '+state.n+' × '+(tr.days-1)+' '+L.night,fmt(s)]);}
    if($('optPickup').checked){total+=PICKUP; lines.push([L.pickup,fmt(PICKUP)]);}
    if($('optBanya').checked){total+=BANYA; lines.push([T.calc.banya,fmt(BANYA)]);}
    if($('optStarlink').checked){var sl=STARLINK*tr.days; total+=sl; lines.push([L.starlink+', '+tr.days+' '+(tr.days>1?L.days:L.day),fmt(sl)]);}
    if($('optSeat').checked){lines.push([L.seat,L.free]);}
    lines.push([L.date,state.date?fmtDate(state.date):L.pickDate]);
    $('sumTitle').textContent=tr.name;
    $('sumLines').innerHTML=lines.map(function(x){return '<div><span>'+esc(x[0])+'</span><span>'+esc(x[1])+'</span></div>'}).join('');
    $('sumTotal').textContent=fmt(total);
    $('sumSub').textContent=fmt(total/state.n)+' '+t('calc.perPerson')+' · ≈ '+fmtT(total*RATE)+' '+t('calc.rate')+' '+RATE+' ₸/$';
    var M=T.calc.msg, opts=[]; if($('optLunch').checked)opts.push(T.calc.lunch); if(tr.days>1&&$('optStay').checked)opts.push(T.calc.stay); if($('optPickup').checked)opts.push(T.calc.pickup); if($('optBanya').checked)opts.push(T.calc.banya); if($('optStarlink').checked)opts.push('Starlink'); if($('optSeat').checked)opts.push(T.calc.seat);
    var msg=M.hello+' '+tr.name+' ('+tr.len+'), '+(state.date?fmtDate(state.date):'—')+', '+state.n+' '+M.travellers+', '+lc(tierName)+'. '+M.car+' '+cf.name+'.'+(opts.length?' '+M.options+' '+lc(opts.join(', '))+'.':'')+' '+M.estimate+' '+fmt(total)+'. '+M.ask;
    if(REF) msg+=' (ref: '+REF+')';
    $('sumWa').href=WA+encodeURIComponent(msg);
    state.lastMsg=msg; state.lastTotal=total;
  }

  /* calendar */
  $('calPrev').addEventListener('click',function(){view.m--; if(view.m<0){view.m=11;view.y--;} renderCal();});
  $('calNext').addEventListener('click',function(){view.m++; if(view.m>11){view.m=0;view.y++;} renderCal();});
  function renderCal(){
    var tr=TOURS[state.tour],g=$('calGrid'),first=new Date(view.y,view.m,1),last=new Date(view.y,view.m+1,0).getDate(); if(!tr){g.textContent='';return;}
    $('calTitle').textContent=MONTHS[LANG][view.m]+' '+view.y;
    $('calPrev').disabled=(view.y===today.getFullYear()&&view.m===today.getMonth());
    var html=WD[LANG].map(function(d){return '<span>'+d+'</span>'}).join('');
    var pad=(first.getDay()+6)%7; for(var i=0;i<pad;i++)html+='<i></i>';
    for(var d=1;d<=last;d++){
      var dt=new Date(view.y,view.m,d),k=key(dt),cls=[],dis=false;
      var bs=busySet(),conflict=false; for(var n=0;n<tr.days;n++){var dd=new Date(dt);dd.setDate(dd.getDate()+n);if(bs[key(dd)]){conflict=true;break;}} if(dt<today)dis=true; if(tr.season.indexOf(view.m+1)<0)dis=true; if(conflict){dis=true;cls.push('busy');}
      if(k===key(today))cls.push('today'); if(state.date&&k===key(state.date))cls.push('sel');
      html+='<button type="button" data-d="'+d+'" class="'+cls.join(' ')+'" aria-label="'+d+' '+MONTHS[LANG][view.m]+'" aria-pressed="'+(state.date&&k===key(state.date)?'true':'false')+'"'+(dis?' disabled':'')+'>'+d+'</button>';
    }
    g.innerHTML=html;
  }
  $('calGrid').addEventListener('click',function(e){var b=e.target.closest('button'); if(!b||b.disabled)return; state.date=new Date(view.y,view.m,+b.getAttribute('data-d')); renderCal(); update();});

  /* custom estimate */
  var est={days:2,km:600};
  $('dMinus').addEventListener('click',function(){if(est.days>1){est.days--;estUpdate();}});
  $('dPlus').addEventListener('click',function(){if(est.days<7){est.days++;estUpdate();}});
  $('kmRange').addEventListener('input',function(){est.km=+this.value;estUpdate();});
  $('estGravel').addEventListener('change',estUpdate);
  function estUpdate(){
    var E=T.pricelist.est.formula, M=T.calc.msg;
    $('dOut').value=est.days; $('kmOut').textContent=est.km.toLocaleString('en-US')+' km';
    var extraKm=Math.max(0,est.km-250*est.days),gravel=$('estGravel').checked?40*est.days:0;
    var total=250*est.days+extraKm*0.25+gravel;
    $('estTotal').textContent='≈ '+fmt(total);
    $('estSub').textContent=est.days+' '+(est.days>1?E.days:E.day)+' × $250'+(extraKm?' + '+extraKm+' '+E.extra+' $0.25':'')+(gravel?' + '+E.gravel+' $'+gravel:'')+' · ≈ '+fmtT(total*RATE)+'. '+E.note;
    $('estWa').href=WA+encodeURIComponent(M.custom+' '+est.days+' '+M.customDays+', '+M.customKm+' '+est.km+' km'+($('estGravel').checked?', '+M.customGravel:'')+'. '+M.customEst+' '+fmt(total)+'. '+M.customPlaces+' ');
  }

  /* requests and contact form → Apps Script (calendar + e-mail to the owner) */
  function post(payload){ return fetch(REQUEST_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)}).then(function(r){if(!r.ok)throw new Error('http');return r.json()}); }
  var reqForm=$('reqForm'),contactForm=$('contactForm');
  if(REQUEST_URL){ reqForm.hidden=false; } else { contactForm.hidden=true; }
  reqForm.addEventListener('submit',function(e){
    e.preventDefault(); var R=T.calc.req,msg=$('reqMsg'),btn=$('reqBtn'),tr=TOURS[state.tour];
    var name=$('reqName').value.trim(),phone=$('reqPhone').value.trim(); msg.className='msg';
    if(btn.disabled)return; if(!state.date){msg.textContent=R.needDate;msg.className='msg bad';return;} if(name.length<2||phone.length<3){msg.textContent=R.needName;msg.className='msg bad';return;}
    var payload={kind:'request',ref:REF,driver:state_driver,source:document.referrer.slice(0,60),date:isoDate(state.date),days:tr.days,tourId:tr.id,tour:tr.name+' ('+tr.len+')',carId:car().id,car:car().name,people:state.n,tier:T.calc.tiers[state.tier],options:state.lastMsg,estimate:$('sumTotal').textContent,name:name,phone:phone,lang:LANG,website:$('reqWebsite').value};
    btn.disabled=true; msg.textContent=R.sending;
    post(payload).then(function(j){
      if(j&&j.ok){ msg.textContent=R.ok; msg.className='msg ok'; for(var n=0;n<tr.days;n++){var dd=new Date(state.date);dd.setDate(dd.getDate()+n);busySet()[key(dd)]=1;} renderCal(); btn.textContent=R.requested; }
      else if(j&&j.error==='busy'){ msg.textContent=R.busy; msg.className='msg bad'; busySet()[key(state.date)]=1; state.date=null; renderCal(); update(); btn.disabled=false; }
      else throw new Error('x');
    }).catch(function(){ msg.textContent=R.fail; msg.className='msg bad'; btn.disabled=false; });
  });
  contactForm.addEventListener('submit',function(e){
    e.preventDefault(); var C=T.cta,out=$('cMsgOut'),btn=$('cBtn'); out.className='msg';
    var name=$('cName').value.trim(),contact=$('cContact').value.trim(),text=$('cMsg').value.trim();
    if(btn.disabled)return; if(name.length<2||contact.length<3||text.length<3){out.textContent=C.formNeed;out.className='msg bad';return;}
    btn.disabled=true; out.textContent=T.calc.req.sending;
    post({kind:'contact',name:name,contact:contact,message:text,lang:LANG,website:$('cWebsite').value}).then(function(j){ if(j&&j.ok){out.textContent=C.formOk;out.className='msg ok';btn.textContent=T.calc.req.requested;} else throw new Error('x'); }).catch(function(){out.textContent=C.formFail;out.className='msg bad';btn.disabled=false;});
  });

  /* header, language */
  var burger=$('burger'),nav=$('nav');
  burger.addEventListener('click',function(){var open=nav.classList.toggle('open');burger.setAttribute('aria-expanded',open?'true':'false');burger.textContent=open?t('nav.close'):t('nav.menu');});
  nav.addEventListener('click',function(e){if(e.target.tagName==='A'){nav.classList.remove('open');burger.setAttribute('aria-expanded','false');burger.textContent=t('nav.menu');}});
  (function(){ var f=$('joinForm'); if(!f)return; f.addEventListener('submit',function(e){ e.preventDefault(); var J=T.join, m=$('jMsg'), b=$('jBtn'); var v=function(id){return ($(id).value||'').trim()}; if(v('jName').length<2||v('jCity').length<2||v('jPhone').length<5){ m.textContent=J.need; m.className='msg bad'; return; }
    var text=J.msg+' '+v('jName')+', '+v('jCity')+'. '+T.join.car+': '+v('jCar')+'. '+T.join.langs+': '+v('jLangs')+'. '+v('jExp');
    var ph=$('jPhoto').files&&$('jPhoto').files[0]; if(ph&&ph.size>4*1024*1024){ m.textContent=J.photoBig; m.className='msg bad'; return; }
    if(!REQUEST_URL){ window.open(WA+encodeURIComponent(text),'_blank','noopener'); m.textContent=J.ok; m.className='msg ok'; return; }
    if(b.disabled)return; b.disabled=true; m.textContent='…'; m.className='msg';
    var readPhoto=ph?new Promise(function(res){var fr=new FileReader(); fr.onload=function(){res(fr.result)}; fr.onerror=function(){res('')}; fr.readAsDataURL(ph);}):Promise.resolve('');
    readPhoto.then(function(photo){ return fetch(REQUEST_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({kind:'join',name:v('jName'),city:v('jCity'),phone:v('jPhone'),car:v('jCar'),langs:v('jLangs'),exp:v('jExp'),photo:photo,lang:LANG,website:$('jWebsite').value,ref:(typeof REF==='string'?REF:'')})}); }).then(function(r){return r.json()}).then(function(j){ b.disabled=false; if(j&&j.ok){ m.textContent=J.ok; m.className='msg ok'; f.reset(); } else { m.textContent=J.fail; m.className='msg bad'; } }).catch(function(){ b.disabled=false; m.textContent=J.fail; m.className='msg bad'; }); }); })();
  $('langSel').addEventListener('change',function(e){var l=e.target.value; try{localStorage.setItem('kbc-lang',l)}catch(x){} if(MULTIPAGE){ location.href=(LANG_URLS[l]||((l==='ru'?'/':'/'+l+'/')))+location.hash; return; } if(!CONTENT[l]){ e.target.value=LANG; return; } LANG=l; T=CONTENT[LANG]; renderAll();});

  function renderAll(){ renderStatic(); buildTours(); buildFromTours(); sel.value=state.tour; onTour(); estUpdate(); applyLive(); setTimeout(function(){ tilt(); reveal(); },50); }
  var live={busy:null,tours:null};
  function applyLive(){
    if(live.busy){ busy={}; live.busy.busy.forEach(function(iso){var p=iso.split('-'); busy[(+p[0])+'-'+(+p[1])+'-'+(+p[2])]=1;}); busyCars={}; Object.keys(live.busy.cars||{}).forEach(function(id){busyCars[id]={}; live.busy.cars[id].forEach(function(iso){var p=iso.split('-'); busyCars[id][(+p[0])+'-'+(+p[1])+'-'+(+p[2])]=1;});}); var u=new Date(live.busy.updated); $('calUpdated').textContent=t('calc.updated')+' '+u.toLocaleDateString(LOCALE[LANG],{day:'numeric',month:'short'})+' '+u.toLocaleTimeString(LOCALE[LANG],{hour:'2-digit',minute:'2-digit'}); renderCal(); update(); }
    if(live.tours){ var u2=new Date(live.tours.updated); $('priceUpdated').textContent=t('pricelist.sheetUpdated')+' '+u2.toLocaleDateString(LOCALE[LANG],{day:'numeric',month:'short'})+' '+u2.toLocaleTimeString(LOCALE[LANG],{hour:'2-digit',minute:'2-digit'})+'.'; }
  }
  renderAll();
  fetch('busy.json',{cache:'no-store'}).then(function(r){return r.ok?r.json():null}).then(function(j){ if(!j||!j.busy)throw new Error('x'); live.busy=j; applyLive(); }).catch(function(){ $('calUpdated').textContent=t('calc.notLoaded'); });
  fetch('tours.json',{cache:'no-store'}).then(function(r){return r.ok?r.json():null}).then(function(j){ if(!j||!j.tours||!j.tours.length)throw new Error('x'); PRICES=j.tours; live.tours=j; buildTours(); buildFromTours(); onTour(); applyLive(); }).catch(function(){ $('priceUpdated').textContent=t('pricelist.builtIn'); });
})();
</script>

</body>
