    var ph=$('jPhoto').files&&$('jPhoto').files[0]; if(ph&&ph.size>4*1024*1024){ m.textContent=J.photoBig; m.className='msg bad'; return; }
    if(!REQUEST_URL){ window.open(WA+encodeURIComponent(text),'_blank','noopener'); m.textContent=J.ok; m.className='msg ok'; return; }
    if(b.disabled)return; b.disabled=true; m.textContent='…'; m.className='msg';
    var readPhoto=ph?new Promise(function(res){var fr=new FileReader(); fr.onload=function(){res(fr.result)}; fr.onerror=function(){res('')}; fr.readAsDataURL(ph);}):Promise.resolve('');
    readPhoto.then(function(photo){ return post({kind:'join',name:v('jName'),city:v('jCity'),phone:v('jPhone'),car:v('jCar'),langs:v('jLangs'),exp:v('jExp'),photo:photo,lang:LANG,website:$('jWebsite').value,ref:(typeof REF==='string'?REF:'')}); }).then(function(r){return r.json()}).then(function(j){ b.disabled=false; if(j&&j.ok){ m.textContent=J.ok; m.className='msg ok'; f.reset(); } else { m.textContent=J.fail; m.className='msg bad'; try{ window.open(WA+encodeURIComponent(text),'_blank','noopener'); }catch(x){} } }).catch(function(){ b.disabled=false; m.textContent=J.fail; m.className='msg bad'; try{ window.open(WA+encodeURIComponent(text),'_blank','noopener'); }catch(x){} }); }); })();
  /* ---------- weather on the routes (Open-Meteo, no key, cached 30 min) ---------- */
  var WX_PLACES=[['almaty',43.238,76.889],['charyn',43.353,79.077],['kolsai',42.956,78.325],['assy',43.218,77.87],['altyn',43.94,78.57],['bao',43.053,76.985],['issyk',43.254,77.478],['tamgaly',44.077,76.991]];
  function wxKind(c){ c=+c; if(c===0)return 'clear'; if(c<=2)return 'partly'; if(c===3)return 'cloudy'; if(c<=48)return 'fog'; if(c<=67||(c>=80&&c<=82))return 'rain'; if(c<=77||c===85||c===86)return 'snow'; return 'storm'; }
  function wxIcon(k){ var S='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">';
    var P={clear:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',partly:'<circle cx="8" cy="9" r="3.2"/><path d="M8 2.5v1.5M2.5 9H4M3.9 4.9l1 1"/><path d="M9 19h8.5a3.5 3.5 0 0 0 .4-7 5 5 0 0 0-9.6 1.3A2.9 2.9 0 0 0 9 19z"/>',cloudy:'<path d="M7 18h10a4 4 0 0 0 .5-8 6 6 0 0 0-11.6 1.6A3.3 3.3 0 0 0 7 18z"/>',fog:'<path d="M5 10h14M3 14h18M6 18h12"/>',rain:'<path d="M7 15h10a4 4 0 0 0 .5-8 6 6 0 0 0-11.6 1.6A3.3 3.3 0 0 0 7 15z"/><path d="M9 18l-1 3M13 18l-1 3M17 18l-1 3"/>',snow:'<path d="M7 14h10a4 4 0 0 0 .5-8 6 6 0 0 0-11.6 1.6A3.3 3.3 0 0 0 7 14z"/><path d="M9 18v3M12 19v3M15 18v3"/>',storm:'<path d="M7 14h10a4 4 0 0 0 .5-8 6 6 0 0 0-11.6 1.6A3.3 3.3 0 0 0 7 14z"/><path d="M13 14l-2 4h3l-2 4"/>'};
    return S+(P[k]||P.cloudy)+'</svg>'; }
  function wxRender(d){ var box=$('wx'); if(!box||!d||!d.list)return; window.__wx=d; var W=T.wx||{}; box.hidden=false;
    var tdeg=function(v){return (v>0?'+':'')+Math.round(v)+'°'};
    $('wxRow').innerHTML=d.list.map(function(x){var k=wxKind(x.code); var days=(x.days||[]).map(function(dy){var wd=new Date(dy.d+'T12:00:00').toLocaleDateString(LOCALE[LANG]||'en-GB',{weekday:'short'}).replace(/\.$/,'').slice(0,2); return '<div class="wx-day">'+esc(wd)+wxIcon(wxKind(dy.c))+'<b>'+tdeg(dy.hi)+'</b><i>'+Math.round(dy.lo)+'°</i></div>'}).join(''); return '<div class="wx-chip" title="'+esc((W.places||{})[x.id]||x.id)+'"><div class="wx-now">'+wxIcon(k)+'<div><b>'+tdeg(x.t)+'</b><span>'+esc((W.places||{})[x.id]||x.id)+'</span><small>'+esc((W.codes||{})[k]||k)+'</small></div></div>'+(days?'<div class="wx-days">'+days+'</div>':'')+'</div>'}).join('');
    wxCarousel();
    $('wxNote').textContent=(W.updated||'')+' '+new Date(d.at).toLocaleTimeString(LOCALE[LANG]||'en-GB',{hour:'2-digit',minute:'2-digit'}); }
  var WXC={t:null,bound:false};
  function wxCarousel(){ var row=$('wxRow'); if(!row)return; var step=function(dir){ var w=(row.querySelector('.wx-chip')||{}).offsetWidth||220; if(dir>0&&row.scrollLeft+row.clientWidth>=row.scrollWidth-4){ row.scrollTo({left:0,behavior:'smooth'}); } else row.scrollBy({left:dir*(w+10),behavior:'smooth'}); };
    if(!WXC.bound){ WXC.bound=true; $('wxPrev').onclick=function(){step(-1)}; $('wxNext').onclick=function(){step(1)}; var box=$('wx'); box.addEventListener('mouseenter',function(){clearInterval(WXC.t)}); box.addEventListener('mouseleave',function(){ clearInterval(WXC.t); if(!REDUCED) WXC.t=setInterval(function(){step(1)},4500); }); }
    clearInterval(WXC.t); if(!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)) WXC.t=setInterval(function(){step(1)},4500); }
  (function(){ var box=$('wx'); if(!box||!window.fetch)return; var KEY='kbc-wx2'; try{ var c=JSON.parse(localStorage.getItem(KEY)||'null'); if(c&&Date.now()-c.at<1800000){ wxRender(c); return; } }catch(e){}
    var u='https://api.open-meteo.com/v1/forecast?latitude='+WX_PLACES.map(function(p){return p[1]}).join(',')+'&longitude='+WX_PLACES.map(function(p){return p[2]}).join(',')+'&current=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min&forecast_days=7&timezone=Asia%2FAlmaty';
    fetch(u).then(function(r){return r.ok?r.json():null}).then(function(j){ if(!j)return; var arr=Array.isArray(j)?j:[j]; var d={at:Date.now(),list:arr.map(function(o,i){var dl=o.daily||{}; return {id:WX_PLACES[i][0],t:o.current.temperature_2m,code:o.current.weather_code,days:(dl.time||[]).map(function(dt,k){return {d:dt,hi:dl.temperature_2m_max[k],lo:dl.temperature_2m_min[k],c:dl.weather_code[k]}})}})}; try{localStorage.setItem(KEY,JSON.stringify(d))}catch(e){} wxRender(d); }).catch(function(){}); })();
  $('langSel').addEventListener('change',function(e){var l=e.target.value; try{localStorage.setItem('kbc-lang',l)}catch(x){} if(MULTIPAGE){ location.href=(LANG_URLS[l]||((l==='ru'?'/':'/'+l+'/')))+location.hash; return; } if(!CONTENT[l]){ e.target.value=LANG; return; } LANG=l; T=CONTENT[LANG]; renderAll();});

  function renderAll(){ renderStatic(); buildTours(); buildFromTours(); sel.value=state.tour; onTour(); estUpdate(); applyLive(); if(window.__wx)wxRender(window.__wx); fleetLive(); applySeasonExperience(); setTimeout(function(){ tilt(); reveal(); },50); }
  var live={busy:null,tours:null};
  function applyLive(){
    if(live.busy){ busy={}; live.busy.busy.forEach(function(iso){var p=iso.split('-'); busy[(+p[0])+'-'+(+p[1])+'-'+(+p[2])]=1;}); busyCars={}; Object.keys(live.busy.cars||{}).forEach(function(id){busyCars[id]={}; live.busy.cars[id].forEach(function(iso){var p=iso.split('-'); busyCars[id][(+p[0])+'-'+(+p[1])+'-'+(+p[2])]=1;});}); var u=new Date(live.busy.updated); $('calUpdated').textContent=t('calc.updated')+' '+u.toLocaleDateString(LOCALE[LANG],{day:'numeric',month:'short'})+' '+u.toLocaleTimeString(LOCALE[LANG],{hour:'2-digit',minute:'2-digit'}); renderCal(); update(); }
    if(live.tours){ var u2=new Date(live.tours.updated); $('priceUpdated').textContent=t('pricelist.sheetUpdated')+' '+u2.toLocaleDateString(LOCALE[LANG],{day:'numeric',month:'short'})+' '+u2.toLocaleTimeString(LOCALE[LANG],{hour:'2-digit',minute:'2-digit'})+'.'; }
  }
  renderAll();
  src('busy').then(function(r){return r.ok?r.json():null}).then(function(j){ if(!j||!j.busy)throw new Error('x'); live.busy=j; applyLive(); }).catch(function(){ $('calUpdated').textContent=t('calc.notLoaded'); });
  src('tours').then(function(r){return r.ok?r.json():null}).then(function(j){ if(!j||!j.tours||!j.tours.length)throw new Error('x'); PRICES=j.tours; live.tours=j; buildTours(); buildFromTours(); onTour(); applyLive(); }).catch(function(){ $('priceUpdated').textContent=t('pricelist.builtIn'); });
})();
