leet":{"kicker":"Fuhrpark","h2":"Das richtige Auto für Ihre Gruppe.","text":"Sechs Autos zur Auswahl: vom Geländewagen mit Leiterrahmen bis zum Minibus. Alle mit Klimaanlage, Ladegeräten und Wasser an Bord. Kindersitz auf Anfrage kostenlos.","items":[{"name":"Toyota Land Cruiser Prado","seats":"bis zu 4 Passagiere","desc":"Asphalt und Schotter, leise und komfortabel auf langen Etappen, großer Kofferraum.","img":"prado"},{"name":"Mitsubishi Pajero Sport","seats":"bis zu 4 Passagiere","desc":"Weißer Geländewagen mit Leiterrahmen, Schnorchel, Seilwinde und Dachträger: für Flussdurchfahrten, den Sand von Altyn-Emel und lange Expeditionen.","img":"pajero"},{"name":"Tank 300","seats":"bis zu 4 Passagiere","desc":"Ein Geländewagen mit Leiterrahmen für das Assy-Plateau, Kaindy und Altyn-Emel, dort, wo aus der Piste ein Pfad wird.","img":"tank"},{"name":"Jetour X70 Plus 2025","seats":"bis zu 6 Passagiere","desc":"Neuer weißer Siebensitzer-Crossover, Baujahr 2025: leiser Innenraum, Klimaautomatik für beide Sitzreihen, Platz für das Gepäck der ganzen Familie. Für Asphaltstrecken und ebene Schotterwege: Scharyn, Kolsai, Tamgaly.","img":"jetour"},{"name":"Volkswagen Touareg V10 TDI","seats":"bis zu 4 Passagiere","desc":"Silberner Touareg mit Fünfliter-V10-Diesel und Luftfederung: schnell und souverän auf der Schnellstraße, sanft auf den Steppenpisten nach Altyn-Emel und Tamgaly.","img":"touareg"},{"name":"Toyota Hiace","seats":"bis zu 9 Passagiere","desc":"Ein Minibus für Gruppen und Familien: Alle fahren zusammen, das Gepäck stört nicht, der Preis pro Auto wird geteilt.","img":"hiace"}],"photoSoon":"Foto folgt in Kürze","choose":"Dieses Auto wählen","live":{"title":"Wo die Autos gerade sind","free":"in Almaty, verfügbar","toward":"unterwegs nach","at":"vor Ort:","back":"Rückfahrt nach Almaty","note":"Positionen werden alle paar Minuten aktualisiert","astana":"in Astana, verfügbar","driver":"Mikhail"}},"food":{"kicker":"Essen unterwegs","h2":"Kasachische Küche, dort, wo sie gekocht wird.","text":"Das Mittagessen auf der Tour ist kein Rasthaus an der Straße, sondern ein Haus in Saty oder eine Jurte auf dem Assy-Plateau. Sagen Sie uns vorher, was Sie essen, und das Menü wird auf Sie abgestimmt: vegetarisch, ohne Schweinefleisch, kindgerecht.","items":[["Beschbarmak","Fleisch auf dünn ausgerolltem Teig, das Hauptgericht jedes Festmahls, im Gästehaus in Saty"],["Kasy und Karta","hausgemachte Pferdewurst, auf dem Tisch der Hirten auf dem Plateau"],["Manti","große gedämpfte Teigtaschen mit Lamm und Zwiebeln, mit saurer Sahne, zum Mittagessen in der Jurte"],["Baursaki und Kaimak","heiße Teigbällchen mit Rahm zum Milchtee, morgens vor der Abfahrt"],["Kumys und Schubat","Stuten- und Kamelmilch in den Jurten auf dem Assy-Plateau, wer mag"],["Schaschlik am Ili","am Ufer, mit Blick auf den Fluss, dazu kasachischer Tee"]],"note":"Das Mittagessen kostet 5–10 $ pro Person und wird vor Ort bezahlt. Ein Picknick ist im Tourpreis nicht enthalten, Wasser und Snacks gibt es aber immer.","photos":["Plow am Fluss","Manti zum Mittagessen","Schaschlik auf Holzkohle"]},"banya":{"kicker":"Sauna am Ufer","h2":"Eine mobile Banja am Fluss.","text":"Wir stellen ein Mobiba-Saunazelt am Fluss, am See oder direkt auf dem Plateau auf, heizen mit Holz, schwitzen und springen ins Wasser. Bequem für bis zu 15 Personen. Nach einem Tag auf staubigen Pisten gibt es nichts Besseres. Birkenquaste, Handtücher und Tee haben wir dabei, im Sommer wie im Winter.","price":"ab $120 pro Abend für die ganze Gruppe","cta":"Banja zur Tour hinzufügen","insta":"Unsere Banja auf Instagram: @mobibantour"},"calc":{"kicker":"Preis und Termine","h2":"Rechnen Sie selbst.","text":"Wählen Sie Tour, Termin und die Zahl der Reisenden. Die Summe gilt pro Auto. Schicken Sie sie direkt per WhatsApp, wir bestätigen den Termin innerhalb einer Stunde.","tour":"Tour","service":"Service","tiers":{"taxi":"Nur Transport","ru":"Fahrer-Guide, Russisch","en":"Fahrer-Guide, Englisch"},"perCar":"pro Auto","serviceHint ne, wie viele Sie sind, was Sie sehen möchten. Oder schicken Sie einfach das Ergebnis des Rechners."],["Sie erhalten Route und Preis","Ein Programmentwurf mit Zeitplan und ein Festpreis pro Auto, noch am selben Tag. Ändern Sie, was Sie möchten."],["Wir holen Sie ab","Am Hotel, zur gewünschten Zeit. Bezahlung am Reisetag in bar, mit Karte oder per Überweisung."]]},"faq":{"kicker":"Fragen","h2":"Bevor Sie schreiben","items":[["Gilt der Preis pro Person oder pro Auto?","Pro Auto, für bis zu vier Personen. Ein Paar und eine Vierergruppe zahlen für das Auto dasselbe; Mittagessen und Übernachtungen werden pro Person gerechnet."],["Bieten Sie Gruppentouren an?","Nein. Jede Fahrt ist privat: Ihre Termine, Ihr Tempo, Ihre Stopps. Ab fünf Personen setzen wir den Minibus ein."],["Wie bezahle ich?","Am Reisetag in bar (Tenge, Dollar, Euro), mit Karte oder per Überweisung. Für zweitägige Touren ist eine Anzahlung von 20 % nötig, um das Gästehaus zu reservieren."],["Was soll ich mitnehmen?","Kleidung im Zwiebelprinzip (an den Seen ist es 10 Grad kälter als in der Stadt), Sonnenschutz, bequeme Schuhe und den Reisepass für die Kontrollposten der Nationalparks."],["Können wir den Plan unterwegs ändern?","Ja. Länger am Aussichtspunkt bleiben, einen Stopp auslassen, einen neuen hinzufügen. Fest sind nur die Schließzeiten der Parks."],["Holen Sie am Flughafen ab und fahren Sie in der Stadt?","Ja. Transfer zu jeder Zeit, Auto mit Fahrer auf Stundenbasis, Stadtrundfahrt durch Almaty. Ein halber Tag am Großen Almaty-See passt in einen langen Zwischenstopp."]]},"cta":{"h2":"Nennen Sie uns Ihre Termine. Route und Preis schicken wir noch heute.","text":"Wir antworten von 8:00 bis 22:00 Uhr Almaty-Zeit, meist innerhalb einer Stunde.","btn":"Auf WhatsApp schreiben","phoneLbl":"WhatsApp und Anrufe","formTitle":"Per E-Mail schreiben","formName":"Name","formContact":"WhatsApp oder E-Mail","formMsg":"Termine, wie viele Sie sind, was Sie sehen möchten","formBtn":"Senden","formHint":"Die Nachricht g
