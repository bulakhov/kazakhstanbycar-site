  function renderAll(){ renderStatic(); buildTours(); buildFromTours(); sel.value=state.tour; onTour(); estUpdate(); applyLive(); if(window.__wx)wxRender(window.__wx); fleetLive(); applySeasonExperience(); setTimeout(function(){ tilt(); reveal(); },50); }
  var live={busy:null,tours:null};
  function applyLive(){
    if(live.busy){ busy={}; live.busy.busy.forEach(function(iso){var p=iso.split('-'); busy[(+p[0])+'-'+(+p[1])+'-'+(+p[2])]=1;}); busyCars={}; Object.keys(live.busy.cars||{}).forEach(function(id){busyCars[id]={}; live.busy.cars[id].forEach(function(iso){var p=iso.split('-'); busyCars[id][(+p[0])+'-'+(+p[1])+'-'+(+p[2])]=1;});}); var u=new Date(live.busy.updated); $('calUpdated').textContent=t('calc.updated')+' '+u.toLocaleDateString(LOCALE[LANG],{day:'numeric',month:'short'})+' '+u.toLocaleTimeString(LOCALE[LANG],{hour:'2-digit',minute:'2-digit'}); renderCal(); update(); }
    if(live.tours){ var u2=new Date(live.tours.updated); $('priceUpdated').textContent=t('pricelist.sheetUpdated')+' '+u2.toLocaleDateString(LOCALE[LANG],{day:'numeric',month:'short'})+' '+u2.toLocaleTimeString(LOCALE[LANG],{hour:'2-digit',minute:'2-digit'})+'.'; }
  }
  renderAll();
  src('busy').then(function(r){return r.ok?r.json():null}).then(function(j){ if(!j||!j.busy)throw new Error('x'); live.busy=j; applyLive(); }).catch(function(){ $('calUpdated').textContent=t('calc.notLoaded'); });
  src('tours').then(function(r){return r.ok?r.json():null}).then(function(j){ if(!j||!j.tours||!j.tours.length)throw new Error('x'); PRICES=j.tours; live.tours=j; buildTours(); buildFromTours(); onTour(); applyLive(); }).catch(function(){ $('priceUpdated').textContent=t('pricelist.builtIn'); });
})();
</script>

</body>
